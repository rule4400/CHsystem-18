name: CHRemoteMonitor

options:
  bundleIdPrefix: com.rule4400.chsystem18
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.45.4"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

packages:
  CHShared:
    path: .

targets:
  SiteCamera:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Apps/SiteCamera
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: CHShared
        product: CHShared
    info:
      path: Apps/SiteCamera/Resources/Info.plist
      properties:
        CFBundleDisplayName: 現場カメラ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 工事現場の映像を本部へ送信するためにカメラを使用します。
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rule4400.chsystem18.sitecamera
        PRODUCT_NAME: SiteCamera
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HQMonitor:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Apps/HQMonitor
        excludes:
          - Resources/Info.plist
          - Resources/HQMonitor.entitlements
    dependencies:
      - package: CHShared
        product: CHShared
    info:
      path: Apps/HQMonitor/Resources/Info.plist
      properties:
        CFBundleDisplayName: 本部監視
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 CHsystem
        NSPrincipalClass: NSApplication
    entitlements:
      path: Apps/HQMonitor/Resources/HQMonitor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rule4400.chsystem18.hqmonitor
        PRODUCT_NAME: HQMonitor
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  SiteCamera:
    build:
      targets:
        SiteCamera: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HQMonitor:
    build:
      targets:
        HQMonitor: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AllApps:
    build:
      targets:
        SiteCamera: all
        HQMonitor: all
